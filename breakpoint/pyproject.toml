[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakpoint-engine"
version = "0.1.0"
description = "Adversarial agents that probe a codebase, with every finding checked against the real source"
readme = "README.md"
requires-python = ">=3.10"
# The CLI uses only the standard library. The web server is optional: pip install -e ".[server]"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.111.0", "uvicorn>=0.29.0"]

[project.scripts]
breakpoint-scan = "breakpoint.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["breakpoint*"]

# Run `pip install -e .` once so VS Code (Pylance) resolves all imports.

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["breakpoint"]

[tool.ruff]
line-length = 100
